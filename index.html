<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<base target="_blank">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zhen Jiang · Homepage</title>
<style>
/* ============================================================
   配色与全局变量（想换主题色只改这里）
   ============================================================ */
:root{
  --bg:#eef2f7;
  --card:#ffffff;
  --text:#1f2933;
  --muted:#64748b;
  --line:#e2e8f0;
  --accent:#2563eb;
  --accent-soft:#e0ecff;
  --radius:14px;
  --shadow:0 1px 3px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.06);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
              "Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
img{max-width:100%}

.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 48px}

/* ============================================================
   语言切换按钮（位于顶部大横栏右上角）
   ============================================================ */
.lang-toggle{
  position:absolute;
  top:14px;right:14px;
  z-index:10;
  display:inline-flex;align-items:center;justify-content:center;
  min-width:52px;
  padding:7px 14px;
  border:1px solid rgba(255,255,255,.75);
  border-radius:999px;
  background:rgba(255,255,255,.95);
  color:#1e3a8a;
  font-family:inherit;
  font-size:.82rem;
  font-weight:700;
  letter-spacing:.5px;
  cursor:pointer;
  box-shadow:0 2px 10px rgba(15,23,42,.22);
  transition:transform .18s, background .18s, box-shadow .18s;
}
.lang-toggle:hover{
  background:#fff;
  transform:translateY(-1px);
  box-shadow:0 4px 14px rgba(15,23,42,.28);
}
.lang-toggle:active{transform:translateY(0)}

/* ============================================================
   1. 顶部大横栏（M51 星系背景 + 深色遮罩）
   ============================================================ */
.hero{
  position:relative;
  display:flex;
  align-items:center;
  padding:28px;
  border-radius:18px;
  overflow:hidden;
  color:#fff;
  background-color:#0b1a3a;                 /* 图片加载前的底色 */
  background-size:cover;                     /* JS 会注入背景图 */
  background-position:center 42%;
  background-repeat:no-repeat;
  box-shadow:0 10px 30px rgba(10,20,60,.35);
}
/* hero 内部真正的内容区（头像 + 信息），按钮不在此区域 */
.hero-main{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  gap:26px;
  width:100%;
  min-width:0;
}
.hero .avatar{
  width:132px;height:132px;
  flex:0 0 auto;
  object-fit:cover;
  border-radius:50%;
  border:4px solid rgba(255,255,255,.8);
  background:#fff;
  box-shadow:0 6px 20px rgba(0,0,0,.28);
}
.hero-info{flex:1;min-width:0}
.hero-info h1{margin:0 0 6px;font-size:1.85rem;letter-spacing:1px;line-height:1.25}
.hero-info .subtitle{margin:0 0 4px;font-size:1rem;opacity:.95}
.hero-info .affil{margin:0;font-size:.88rem;opacity:.85}
/* 横栏背景图出处（右下角） */
#heroCredit{position:absolute;right:16px;bottom:12px;z-index:3;text-align:right}
.hero-credit{
  font-size:.68rem;
  line-height:1.4;
  color:rgba(255,255,255,.62);
  text-decoration:none;
  letter-spacing:.2px;
  text-shadow:0 1px 3px rgba(0,0,0,.55);
  transition:color .18s;
}
a.hero-credit:hover{color:rgba(255,255,255,.95)}

/* 联系方式（已并入横栏，位于实验室信息下方） */
.contact-bar{
  display:flex;flex-wrap:wrap;gap:9px;
  margin-top:16px;
}
.contact-item{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 13px;
  border-radius:999px;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.30);
  color:#fff;
  font-size:.8rem;
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  transition:background .18s, border-color .18s, transform .18s;
}
.contact-item:hover{
  background:rgba(255,255,255,.28);
  border-color:rgba(255,255,255,.60);
  transform:translateY(-1px);
  color:#fff;
}
.contact-item svg{width:14px;height:14px;flex:0 0 auto}

/* ============================================================
   2. 主体两栏布局
   ============================================================ */
.layout{
  display:grid;
  grid-template-columns:minmax(0,330px) minmax(0,1fr);
  gap:20px;
  margin-top:20px;
  align-items:start;
}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}

.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:20px;
  border:1px solid rgba(226,232,240,.9);
  box-shadow:var(--shadow);
}
.card-flush{padding:0;overflow:hidden}

.card h2{
  display:flex;align-items:center;gap:9px;
  margin:0 0 15px;
  font-size:1rem;
  letter-spacing:.5px;
  font-weight:700;
}
.card h2::before{
  content:"";
  width:4px;height:16px;border-radius:2px;
  background:var(--accent);
  flex:0 0 auto;
}

/* ---------- 教育经历 ---------- */
.edu-item{
  position:relative;
  padding-left:18px;
  padding-bottom:16px;
  border-left:2px solid var(--line);
}
.edu-item:last-child{padding-bottom:0;border-left-color:transparent}
.edu-item::before{
  content:"";
  position:absolute;left:-6px;top:6px;
  width:10px;height:10px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 0 3px #dbeafe;
}
.edu-period{font-size:.76rem;color:var(--muted);letter-spacing:.5px}
.edu-school{font-weight:600;font-size:.94rem}
.edu-degree{font-size:.84rem;color:var(--muted);line-height:1.55}

/* ---------- 当前动态 ---------- */
.eff-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.eff-label{font-size:.84rem;color:var(--muted)}
.eff-score{font-size:1.65rem;font-weight:700;color:var(--accent);line-height:1}
.eff-score .unit{font-size:.78rem;font-weight:500;color:var(--muted);margin-left:2px}
.bar{height:8px;border-radius:99px;background:#e8eef8;overflow:hidden}
.bar-fill{
  height:100%;border-radius:99px;
  background:#2563eb;                       /* 默认色，JS 会按分数覆盖 */
  transition:width .6s ease, background .6s ease;
}
.eff-time{font-size:.75rem;color:var(--muted);margin-top:6px}

.status-block{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.status-label{font-size:.84rem;color:var(--muted);margin-bottom:9px}
.status-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 11px;
  font-size:.82rem;
  border-radius:999px;
  background:#f1f5f9;
  color:#94a3b8;
  border:1px solid transparent;
  white-space:nowrap;
  transition:.2s;
}
.chip.active{
  background:var(--accent-soft);
  color:var(--accent);
  border-color:#bfdbfe;
  font-weight:600;
}

/* ---------- 待办事项 ---------- */
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
.todo li{display:flex;align-items:flex-start;gap:9px;font-size:.86rem;line-height:1.55}
.todo .more{justify-content:flex-start;color:var(--muted);letter-spacing:2px;padding-top:2px}
.tag.ghost{background:transparent;border-color:transparent;visibility:hidden}
.tag{
  flex:0 0 auto;
  min-width:58px;
  margin-top:2px;
  padding:1px 7px;
  text-align:center;
  font-size:.68rem;
  font-weight:700;
  letter-spacing:.2px;
  border-radius:5px;
}
.tag.ongoing{background:#dcfce7;color:#15803d}
.tag.todo{background:#fef3c7;color:#b45309}
.todo-text{flex:1;min-width:0}

/* ---------- 友情链接 ---------- */
.link-group + .link-group{
  margin-top:14px;
  padding-top:14px;
  border-top:1px dashed var(--line);
}
.link-group-title{
  font-size:.76rem;
  font-weight:700;
  letter-spacing:.5px;
  color:var(--muted);
  margin-bottom:8px;
}
.link-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.friend-link{
  display:block;
  min-width:0;
  padding:2px 0;
  font-size:.85rem;
  color:var(--text);
  overflow-wrap:anywhere;
  word-break:break-word;
  transition:color .18s;
}
.friend-link:hover{color:var(--accent)}
.friend-link-name{
  font-weight:600;
}
.friend-link-name::after{
  content:"↗";
  display:inline-block;
  margin-left:3px;
  font-size:.7rem;
  font-weight:400;
  opacity:.5;
  transform:translateY(-1px);
}
.friend-link-desc{
  font-size:.75rem;
  color:var(--muted);
  margin-left:5px;
}

/* ---------- 轮播图（更扁：桌面 2:1，手机 16:9） ---------- */
.carousel{position:relative;aspect-ratio:2/1;background:#e2e8f0;overflow:hidden}
.slide{
  position:absolute;inset:0;
  opacity:0;
  transition:opacity .8s ease;
}
.slide.active{opacity:1}
.slide img{
  display:block;
  width:100%;height:100%;
  object-fit:cover;
}
.slide-caption{
  position:absolute;
  left:16px;bottom:14px;
  z-index:2;
  max-width:calc(100% - 110px);
  padding:5px 14px;
  font-size:.84rem;
  font-weight:500;
  line-height:1.4;
  color:#fff;
  background:rgba(15,23,42,.55);
  border-radius:999px;
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  letter-spacing:.2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
/* 左右切换箭头 */
.carousel-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  z-index:4;
  display:flex;align-items:center;justify-content:center;
  width:38px;height:38px;
  padding:0;
  border:0;
  border-radius:50%;
  background:rgba(15,23,42,.42);
  color:#fff;
  cursor:pointer;
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  opacity:0;
  transition:opacity .2s, background .2s;
}
.carousel-arrow.prev{left:12px}
.carousel-arrow.next{right:12px}
.carousel:hover .carousel-arrow,
.carousel-arrow:focus-visible{opacity:1}
.carousel-arrow:hover{background:rgba(15,23,42,.70)}
.carousel-arrow svg{width:18px;height:18px}
@media (hover:none){
  .carousel-arrow{opacity:1}
}
.dots{
  position:absolute;left:0;right:0;bottom:12px;
  display:flex;justify-content:center;gap:8px;
  z-index:3;
}
.dot{
  width:8px;height:8px;padding:0;border:0;cursor:pointer;
  border-radius:50%;
  background:rgba(255,255,255,.55);
  transition:.25s;
}
.dot.active{width:22px;border-radius:4px;background:#fff}

/* ---------- 正文段落 ---------- */
.para{font-size:.9rem;color:#334155;margin:0 0 10px;text-align:justify}
.para:last-child{margin-bottom:0}

/* ---------- 研究主题模块 ---------- */
.topics{display:flex;flex-direction:column;gap:20px}
.topic{
  display:grid;
  grid-template-columns:220px minmax(0,1fr);
  gap:20px;
  align-items:center;          /* 关键：图片随右侧变高时垂直居中 */
}
/* 展开后：图片固定左上浮动，文字环绕，论文用满图片下方宽度 */
.topic.expanded{
  display:block;
  overflow:hidden;            /* 清除浮动，让容器包住图片和文字 */
}
.topic.expanded .topic-media{
  float:left;
  width:220px;
  margin:0 20px 12px 0;
  position:relative;      /* 新增 */
  z-index:1;              /* 新增：让图片区域在文字容器之上 */
}
.topic.expanded .papers{
  overflow:hidden;            /* 建立 BFC，确保论文在图片下方，不被图片挤压 */
}
.topic-media img{
  display:block;width:100%;
  aspect-ratio:3/4;            /* 纵向；觉得不够高可改 2/3，觉得太高可改 4/5 */
  object-fit:cover;
  border-radius:10px;
  background:#e2e8f0;
}
.topic-media-caption{
  margin-top:8px;
  font-size:.75rem;
  line-height:1.5;
  color:var(--muted);
  text-align:center;
  letter-spacing:.2px;
}
/* 主题图片放大预览 */
.topic-media img{cursor:zoom-in}

.lightbox{
  position:fixed;
  inset:0;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:rgba(10,14,28,.9);
  opacity:0;
  transition:opacity .25s ease;
}
.lightbox.open{
  display:flex;
  opacity:1;
}
.lightbox-img{
  max-width:92vw;
  max-height:80vh;          /* 原为 88vh */
  object-fit:contain;
  border-radius:8px;
  box-shadow:0 20px 60px rgba(0,0,0,.55);
  transform:scale(.96);
  transition:transform .25s ease;
}
.lightbox-figure{
  margin:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  max-height:92vh;
}
.lightbox-caption{
  color:rgba(255,255,255,.78);
  font-size:.82rem;
  line-height:1.5;
  text-align:center;
  max-width:80vw;
  letter-spacing:.2px;
}
.lightbox-caption:empty{display:none}   /* 没有标题时不占位 */
.lightbox.open .lightbox-img{transform:scale(1)}
.lightbox-close{
  position:absolute;
  top:20px;right:24px;
  width:42px;height:42px;
  padding:0;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.15);
  color:#fff;
  font-size:1.5rem;
  line-height:1;
  cursor:pointer;
  transition:background .18s;
}
.lightbox-close:hover{background:rgba(255,255,255,.32)}
body.lightbox-open{overflow:hidden}

@media (max-width:640px){
  .lightbox{padding:12px}
  .lightbox-close{top:12px;right:12px;width:36px;height:36px;font-size:1.3rem}
  .lightbox-img{max-width:96vw;max-height:72vh}
  .lightbox-caption{font-size:.76rem;max-width:90vw}
}
.topic-body{min-width:0}
/* 介绍文字折叠 */
/* 折叠容器：相对定位，作为按钮的定位基准 */
.topic-text-wrap{
  position:relative;
}

/* 文字：多行截断，末尾自动省略号 */
.topic-text{
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:7;          /* 显示几行，按需调整 */
  overflow:hidden;
}
.topic-text.expanded{
  display:block;
  -webkit-line-clamp:unset;
  overflow:visible;
}

/* More 按钮：无边框，绝对定位到右下角，跟在第 4 行文字后面 */
.topic-more{
  display:none;
  position:absolute;
  right:0;
  bottom:0;
  padding:0 2px 0 28px;
  border:0;
  background:linear-gradient(to right, rgba(255,255,255,0) 0%, var(--card) 45%);
  color:var(--accent);
  font-family:inherit;
  font-size:.75rem;
  line-height:1.6;
  cursor:pointer;
  transition:color .18s;
}
.topic-more:hover{color:#1d4ed8}

/* 展开后：按钮变成“收起”，放到文字下方、右对齐 */
.topic-text-wrap.expanded .topic-more{
  position:static;
  display:block;
  margin:6px 0 0 auto;
  padding:0;
  background:none;
  color:var(--accent);
}

.papers{margin-top:15px;padding-top:14px;border-top:1px dashed var(--line)}
.papers-head{
  font-size:.78rem;font-weight:700;letter-spacing:1px;
  color:var(--muted);margin-bottom:9px;
}
.paper-list{margin:0;padding-left:1.25em;font-size:.85rem;line-height:1.6}
.paper-list li{margin-bottom:9px}
.paper-list li:last-child{margin-bottom:0}
.paper-list li::marker{color:var(--accent);font-weight:700}
.paper-title{display:block;font-weight:600;color:#1e293b}
.paper-meta{display:block;color:var(--muted);font-size:.8rem}
.paper-link{font-size:.78rem;margin-left:4px}

/* ---------- 兴趣标签 ---------- */
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tag-pill{
  font-size:.78rem;
  padding:4px 12px;
  border-radius:999px;
  background:#f1f5f9;
  color:#475569;
  border:1px solid var(--line);
}

/* ---------- 页脚（单行三段，竖线分隔） ---------- */
.footer{
  margin-top:34px;
  text-align:center;
  font-size:.78rem;
  line-height:2;
  color:var(--muted);
  padding:0 4px;
}
.footer-sep{
  margin:0 8px;
  opacity:.45;
}

/* ============================================================
   3. 响应式
   ============================================================ */
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .layout > main.col{order:-1}
  .layout > aside.col{order:0}
  .topic{grid-template-columns:1fr}
  .topic-media img{
    aspect-ratio:auto;
    height:auto;
    max-height:35vh;        /* 防止纵幅图占满整屏，可按需调 */
    object-fit:contain;
  }
  /* 窄屏展开时保持单列，不要让图片浮动把文字挤成窄条 */
  .topic.expanded{
    display:grid;
    grid-template-columns:1fr;
    overflow:visible;
  }
  .topic.expanded .topic-media{
    float:none;
    width:auto;
    margin:0;
  }
  .topic.expanded .papers{
    overflow:visible;
  }
}
@media (max-width:640px){
  .wrap{padding:14px 12px 36px}
  .hero{padding:24px 20px 42px}          /* 原为 24px 20px，底部多留空间 */
  #heroCredit{right:12px;bottom:10px}
  .hero-credit{font-size:.6rem}
  .hero-main{flex-direction:column;text-align:center;gap:16px}
  .hero .avatar{width:106px;height:106px}
  .hero-info h1{font-size:1.5rem}
  .contact-bar{justify-content:center}
  .card{padding:16px}
  .carousel{aspect-ratio:16/9}
  .slide-caption{left:12px;bottom:11px;max-width:calc(100% - 84px);font-size:.78rem;padding:4px 11px}
  .para{text-align:left}
  .lang-toggle{top:12px;right:12px;min-width:46px;padding:6px 12px}
  .footer{font-size:.74rem;line-height:1.9}
  .footer-sep{margin:0 5px}
  .carousel-arrow{width:32px;height:32px}
  .carousel-arrow.prev{left:8px}
  .carousel-arrow.next{right:8px}
  .carousel-arrow svg{width:16px;height:16px}
}
</style>
</head>

<body>

<div class="wrap">

  <!-- 顶部横栏：按钮固定在横栏内部右上角 -->
  <header class="hero" id="hero">
    <button class="lang-toggle" id="langToggle" type="button">
      <span id="langLabel">EN</span>
    </button>
    <div class="hero-main" id="heroMain"></div>
    <div id="heroCredit"></div>
  </header>

  <!-- 主体两栏 -->
  <div class="layout">

    <!-- 左列 -->
    <aside class="col">
      <section class="card">
        <h2 id="h-education"></h2>
        <div id="education"></div>
      </section>

      <section class="card">
        <h2 id="h-status"></h2>
        <div id="status"></div>
      </section>

      <section class="card">
        <h2 id="h-todo"></h2>
        <ul class="todo" id="todo"></ul>
      </section>

      <!-- 友情链接 -->
      <section class="card">
        <h2 id="h-links"></h2>
        <div id="friendLinks"></div>
      </section>
    </aside>

    <!-- 右列 -->
    <main class="col">
      <section class="card card-flush">
        <div class="carousel" id="carousel"></div>
      </section>

      <section class="card">
        <h2 id="h-intro"></h2>
        <div id="intro"></div>
      </section>

      <div class="topics" id="topics"></div>

      <section class="card">
        <h2 id="h-hobbies"></h2>
        <div id="hobbies"></div>
      </section>
    </main>
  </div>

  <footer class="footer" id="footer"></footer>
</div>

<!-- 图片放大预览 -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox-close" id="lightboxClose" type="button" aria-label="关闭">×</button>
  <figure class="lightbox-figure">
    <img class="lightbox-img" id="lightboxImg" src="" alt="">
    <figcaption class="lightbox-caption" id="lightboxCaption"></figcaption>
  </figure>
</div>

<script>

/* ---------- 当前语言 ---------- */
// let currentLang = 'zh';
let currentLang = (navigator.language || '').toLowerCase().startsWith('en') ? 'en' : 'zh';
try {
  const saved = localStorage.getItem('site-lang');
  if (saved === 'zh' || saved === 'en') currentLang = saved;
} catch (e) { /* localStorage 不可用时忽略 */ }

/* ---------- 取当前语言文本 ----------
   支持字符串、{zh,en} 对象、null；数组请在外层自行 map   */
function pick(v){
  if (v === null || v === undefined) return '';
  if (typeof v === 'object' && !Array.isArray(v)) {
    return (v[currentLang] !== undefined) ? v[currentLang]
         : (v.zh !== undefined ? v.zh : (v.en !== undefined ? v.en : ''));
  }
  return v;
}

/* ---------- 评分颜色：0 红 → 20 橙 → 40 黄 → 60 绿 → 80 蓝 → 100 蓝紫 ----------
   每 20 分为一个颜色节点，节点之间线性插值，分数变化时颜色平滑过渡。   */
const SCORE_COLORS = [
  { at: 0,   rgb:[239,  68,  68] },  // 红   #ef4444
  { at: 20,  rgb:[249, 115,  22] },  // 橙   #f97316
  { at: 40,  rgb:[234, 179,   8] },  // 黄   #eab308
  { at: 60,  rgb:[ 34, 197,  94] },  // 绿   #22c55e
  { at: 80,  rgb:[ 59, 130, 246] },  // 蓝   #3b82f6
  { at: 100, rgb:[139,  92, 246] }   // 蓝紫 #8b5cf6
];

function scoreColor(pct){
  const p = Math.max(0, Math.min(100, Number(pct) || 0));
  for (let i = 0; i < SCORE_COLORS.length - 1; i++) {
    const a = SCORE_COLORS[i], b = SCORE_COLORS[i + 1];
    if (p >= a.at && p <= b.at) {
      const t = (p - a.at) / (b.at - a.at);
      const rgb = a.rgb.map((v, k) => Math.round(v + (b.rgb[k] - v) * t));
      return `rgb(${rgb.join(',')})`;
    }
  }
  return `rgb(${SCORE_COLORS[SCORE_COLORS.length - 1].rgb.join(',')})`;
}

/* ---------- 日期时间格式化与解析 ----------
   withTime = true  显示到分钟；false 只显示日期               */
const EN_MONTHS = ["January","February","March","April","May","June",
                   "July","August","September","October","November","December"];

function formatDateTime(date, withTime){
  const y  = date.getFullYear();
  const m  = date.getMonth() + 1;
  const d  = date.getDate();
  const hh = String(date.getHours()).padStart(2, '0');
  const mm = String(date.getMinutes()).padStart(2, '0');

  if (currentLang === 'zh') {
    return withTime
      ? `${y}年${m}月${d}日 ${hh}:${mm}`
      : `${y}年${m}月${d}日`;
  }
  return withTime
    ? `${EN_MONTHS[date.getMonth()]} ${d}, ${y} ${hh}:${mm}`
    : `${EN_MONTHS[date.getMonth()]} ${d}, ${y}`;
}

/* 解析时间字段：
   - "auto"          → 使用本文件的最后修改时间 document.lastModified
   - {zh,en} / 字符串 → 原样取用当前语言文本                        */
function resolveDateTime(v, withTime){
  if (v === 'auto') {
    const raw = document.lastModified;
    let d = raw ? new Date(raw) : null;
    if (!d || isNaN(d.getTime())) d = new Date();   // 读取失败时退回当前时间
    return formatDateTime(d, withTime);
  }
  return pick(v);
}

/* ---------- 轮播（重建时清理旧定时器） ---------- */
let carouselTimer = null;

function renderCarousel(){
  if (carouselTimer) { clearInterval(carouselTimer); carouselTimer = null; }

  const box   = document.getElementById('carousel');
  const items = DATA.carousel || [];
  if (!items.length) { box.innerHTML = ''; return; }

  box.innerHTML =
    items.map((p, i) => {
      const title = p.title ? pick(p.title) : '';
      return `<div class="slide${i === 0 ? ' active' : ''}">
                <img src="${p.src}" alt="${pick(p.alt) || title || ''}">
                ${title ? `<div class="slide-caption">${title}</div>` : ''}
              </div>`;
    }).join('') +
    `<button class="carousel-arrow prev" type="button" data-dir="-1" aria-label="${pick(UI.carouselPrev)}">
       <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
         <path d="m15 5-7 7 7 7"/>
       </svg>
     </button>
     <button class="carousel-arrow next" type="button" data-dir="1" aria-label="${pick(UI.carouselNext)}">
       <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
         <path d="m9 5 7 7-7 7"/>
       </svg>
     </button>` +
    `<div class="dots">` +
    items.map((_, i) =>
      `<button class="dot${i === 0 ? ' active' : ''}" data-i="${i}" aria-label="${i + 1}"></button>`
    ).join('') +
    `</div>`;

  const slides = [...box.querySelectorAll('.slide')];
  const dots   = [...box.querySelectorAll('.dot')];
  const arrows = [...box.querySelectorAll('.carousel-arrow')];
  let cur = 0;

  function go(i){
    cur = (i + slides.length) % slides.length;
    slides.forEach((s, k) => s.classList.toggle('active', k === cur));
    dots.forEach((d, k) => d.classList.toggle('active', k === cur));
  }
  function stop(){
    if (carouselTimer) { clearInterval(carouselTimer); carouselTimer = null; }
  }
  function start(){
    stop();
    carouselTimer = setInterval(() => go(cur + 1), DATA.carouselInterval || 5000);
  }

  dots.forEach(d => d.addEventListener('click', () => { go(+d.dataset.i); start(); }));
  arrows.forEach(btn => {
    btn.addEventListener('click', () => {
      go(cur + Number(btn.dataset.dir));
      start();
    });
  });
  /* 用 on* 赋值，避免重复渲染时叠加监听器 */
  box.onmouseenter = stop;
  box.onmouseleave = start;

  start();
}

function renderTopics(){
  document.getElementById('topics').innerHTML = DATA.topics.map(t => {

        <div class="papers-head">${pick(UI.paperHead)}</div>
        <ol class="paper-list">

            <li>
              <span class="paper-title">${p.title}${p.link ? `<a class="paper-link" href="${p.link}" target="_blank" rel="noopener">[ADS]</a>` : ''}</span>
              <span class="paper-meta">${p.authors} · <em>${p.venue}</em>, ${p.year}</span>
            </li>`).join('')}
        </ol>
      </div>` : '';

    return `
      <section class="card">
        <h2>${pick(t.title)}</h2>
        <div class="topic">
          <div class="topic-media">
            <img src="${t.image}" alt="${pick(t.title)}">
            ${t.imageCaption ? `<div class="topic-media-caption">${pick(t.imageCaption)}</div>` : ''}
          </div>
          <div class="topic-body">
            <div class="topic-text-wrap">
              <div class="topic-text">
                ${t.paragraphs.map(p => `<p class="para">${pick(p)}</p>`).join('')}
              </div>
              <button class="topic-more" type="button"></button>
            </div>
            ${papers}
          </div>
        </div>
      </section>`;
  }).join('');

  /* 初始化“更多/收起” */
  document.querySelectorAll('.topic-text-wrap').forEach(wrap => {
    const text = wrap.querySelector('.topic-text');
    const btn  = wrap.querySelector('.topic-more');
    if (!text || !btn) return;

    /* 内容没有超出固定高度时不显示按钮 */
    if (text.scrollHeight <= text.clientHeight + 2) {
      btn.style.display = 'none';
      return;
    }
    btn.style.display = 'inline-flex';
    btn.textContent = pick(UI.topicMore);

    btn.addEventListener('click', () => {
      const expanded = text.classList.toggle('expanded');
      wrap.classList.toggle('expanded', expanded);

      /* 通知外层 .topic 切换布局 */
      const topicEl = wrap.closest('.topic');
      if (topicEl) topicEl.classList.toggle('expanded', expanded);

      btn.textContent = expanded ? pick(UI.topicLess) : pick(UI.topicMore);
    });
  });
}

/* ---------- 图片放大预览 ---------- */
function openLightbox(src, alt, caption){
  const lb   = document.getElementById('lightbox');
  const img  = document.getElementById('lightboxImg');
  const cap  = document.getElementById('lightboxCaption');
  if (!lb || !img || !src) return;

  img.src = src;
  img.alt = alt || '';
  if (cap) cap.textContent = caption || '';

  lb.classList.add('open');
  lb.setAttribute('aria-hidden', 'false');
  document.body.classList.add('lightbox-open');
}

function closeLightbox(){
  const lb   = document.getElementById('lightbox');
  const img  = document.getElementById('lightboxImg');
  const cap  = document.getElementById('lightboxCaption');
  if (!lb) return;

  lb.classList.remove('open');
  lb.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('lightbox-open');
  setTimeout(() => {
    if (!lb.classList.contains('open')) {
      img.src = '';
      if (cap) cap.textContent = '';
    }
  }, 260);
}

  renderHobbies();
  renderFooter();
}

/* ---------- 语言切换 ---------- */
function updateLangButton(){
  document.getElementById('langLabel').textContent = pick(UI.langSwitch);
  const btn = document.getElementById('langToggle');
  btn.setAttribute('aria-label',
    currentLang === 'zh' ? 'Switch to English' : '切换为中文');
}

function applyLang(){
  document.documentElement.lang = (currentLang === 'zh') ? 'zh-CN' : 'en';
  updateLangButton();
  renderAll();
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('langToggle').addEventListener('click', () => {
    currentLang = (currentLang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('site-lang', currentLang); } catch (e) {}
    applyLang();
  });

    /* 图片放大预览的事件绑定（只绑一次，动态图片靠事件委托） */
  document.addEventListener('click', (e) => {
    const img = e.target.closest('.topic-media img');
    if (!img) return;

    /* 从图片的同级节点里取标题，没有就不传 */
    const capEl = img.parentElement.querySelector('.topic-media-caption');
    const caption = capEl ? capEl.textContent.trim() : '';

    openLightbox(img.src, img.alt, caption);
  });

  document.getElementById('lightboxClose')
    .addEventListener('click', closeLightbox);

  document.getElementById('lightbox')
    .addEventListener('click', (e) => {
      if (e.target.id === 'lightbox') closeLightbox();   // 点遮罩空白处关闭
    });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
  });

  applyLang();
});
